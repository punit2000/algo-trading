# =============================================================================
# algo-trading — GitHub Actions CI
# =============================================================================
# Pipeline:
#   lint → type-check → test → docker-build
#
# Triggered on:
#   - push to main
#   - pull requests targeting main
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format check (ruff)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check app/ tests/ scripts/

      - name: Format check (ruff format)
        run: uv run ruff format --check app/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # Type checking (mypy)
  # ---------------------------------------------------------------------------
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Type check (mypy)
        run: uv run mypy app/

  # ---------------------------------------------------------------------------
  # Unit & integration tests (pytest)
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      LOG_FORMAT: console
      LIVE_TRADING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Docker build smoke test
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t algo-trading:ci-${{ github.sha }} \
            .

      - name: Smoke test — health check
        run: |
          docker run --rm \
            -e APP_ENV=test \
            -e LOG_FORMAT=console \
            -e LIVE_TRADING=false \
            algo-trading:ci-${{ github.sha }} \
            python -c "from app.main import health_check; h = health_check(); assert h.status == 'ok', h; print('Health check passed:', h)"
