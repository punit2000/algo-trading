[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "algo-trading"
version = "0.1.0"
description = "Production-quality algorithmic trading platform (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "algo-trading" }]

dependencies = [
    # Configuration
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Structured logging
    "structlog>=24.2",

    # HTTP / API  (stubs for future milestones — imported lazily)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Data (stubs for M1+)
    "numpy>=1.26",
    "pandas>=2.2",

    # DB (stubs for M1+)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",

    # Redis (stubs for M7+)
    "redis>=5.0",

    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",   # pretty console output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
]

[project.scripts]
algo-trading = "app.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-redis>=4.6.0.20241004",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S101",    # use of assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"scripts/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["migrations/", "scripts/", "tests/"]

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that require external services",
    "regression: backtest regression tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/api/*", "app/brokers/*"]  # stubs — no logic yet

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
