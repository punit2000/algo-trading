# =============================================================================
# algo-trading — Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env      # fill in values
#   docker compose up         # start all services
#
# Services:
#   trading-engine  — the Python application (app/main.py)
#   postgres        — PostgreSQL (activated in M1)
#   redis           — Redis (activated in M7)
#
# IMPORTANT: LIVE_TRADING=false is the default. Never change this without
# completing all M12 safety checks.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Trading Engine
  # ---------------------------------------------------------------------------
  trading-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: algo-trading-engine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Safety override — explicit. Never rely solely on .env for this.
      LIVE_TRADING: "false"
      APP_ENV: development
      LOG_FORMAT: console
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    volumes:
      - ../data:/app/data:ro   # read-only mount of local market data

  # ---------------------------------------------------------------------------
  # PostgreSQL (activated in M1)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: algo-trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: algo_trading
      POSTGRES_USER: ${POSTGRES_USER:-algo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algo} -d algo_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (activated in M7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: algo-trading-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  trading-net:
    driver: bridge
